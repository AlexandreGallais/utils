name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm avant setup-node : nécessaire pour le cache pnpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/create-transfer.ts
      - uses: actions/upload-artifact@v4
        with:
          name: transfer
          path: transfer
          retention-days: 30
          if-no-files-found: error
