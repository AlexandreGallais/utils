name: Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm transfer
      - name: Zip
        run: |
          test -d transfer || { echo "Dossier transfer introuvable"; exit 1; }
          zip -r transfer.zip transfer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view transfer >/dev/null 2>&1 \
            || gh release create transfer --title "Transfer" --notes "Dernier build du dossier transfer"
          gh release upload transfer transfer.zip --clobber
