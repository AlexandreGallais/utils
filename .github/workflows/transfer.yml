name: Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm transfer
      - name: Publish to branch "transfer"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d transfer || { echo "Dossier transfer introuvable"; exit 1; }
          cd transfer
          git init -b transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "transfer: ${{ github.sha }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" transfer
