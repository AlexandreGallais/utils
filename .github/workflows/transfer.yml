name: Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra:
        description: "Packs en plus, séparés par ';' (ex : src/svg;src/chart src/math)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: transfer
  cancel-in-progress: true

env:
  # Un pack par ligne ; plusieurs dossiers sur une ligne = un seul fichier
  DEFAULT_PACKS: |
    lint
    src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pack
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          packs="$DEFAULT_PACKS"$'\n'"${EXTRA//;/$'\n'}"
          while IFS= read -r pack; do
            [ -z "$pack" ] && continue
            node scripts/create-transfer.mjs $pack
          done <<< "$packs"
          ls -la transfer
      - name: Publish to branch "transfer"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd transfer
          git init -b transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "transfer: ${{ github.sha }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" transfer
