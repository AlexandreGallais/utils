name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # pnpm first, at the version of `packageManager`: setup-node caches the pnpm store and needs pnpm for it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The SVG specs run in Chromium (the `browser` project of Vitest): headless shell only, with its system libraries.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm check
      - if: github.event_name == 'pull_request'
        run: pnpm lint:commits
