# Native binaries (esbuild, rollup, lmdb, unrs-resolver…) for every platform in one node_modules:
# the same folder works on macOS, Windows, Linux and in the devcontainer, and can be deleted freely.
supportedArchitectures:
  os: [darwin, linux, win32]
  cpu: [arm64, x64]
  libc: [glibc]

# No install scripts: they would rebuild binaries for the installing machine only.
# The prebuilt binaries above cover every platform.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - typescript-eslint@8.71.0
  - eslint-plugin-jsdoc@65.0.0
